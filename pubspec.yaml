name: fit_scale_lint
description: >-
  Lint rules and quick fixes that catch layouts which overflow or shrink
  touch targets on small screens, and move code to the fit_scale package.
version: 0.1.0
repository: https://github.com/arahimli/fit_scale_lint
issue_tracker: https://github.com/arahimli/fit_scale_lint/issues
topics:
  - lints
  - responsive
  - layout
  - accessibility
  - screen-size

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  analyzer: ">=6.6.0 <9.0.0"
  analyzer_plugin: ">=0.11.0 <0.14.0"
  custom_lint_builder: ">=0.7.0 <0.9.0"

dev_dependencies:
  lints: ">=4.0.0 <7.0.0"
  test: ^1.25.0

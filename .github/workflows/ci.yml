name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Flutter ${{ matrix.flutter }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest version with analyzer plugins (Dart 3.10, analyzer 12),
        # and the latest stable (an empty version means latest).
        include:
          - flutter: '3.38.9'
            version: '3.38.9'
          - flutter: stable
            version: ''
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.version }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter pub get
        working-directory: example

      # The formatter's style follows the SDK; check with the latest.
      - name: Format
        if: matrix.flutter == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test tool example/lib

      - name: Analyze
        run: dart analyze --fatal-infos

      - run: dart test

      # Loads the plugin into the real analysis server on example/: every
      # rule must report exactly on the lines marked expect_lint.
      - name: Check the example
        run: dart run tool/check_example.dart

      - name: Publish dry run
        if: matrix.flutter == 'stable'
        run: |
          git diff
          git checkout -- .
          dart pub publish --dry-run
